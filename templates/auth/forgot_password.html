{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card animate__animated animate__fadeInUp">
    <div class="auth-logo">
      <i class="fas fa-key" style="color:var(--accent-warning)"></i>
      <h1>Reset Password</h1>
      <p>Enter your username and registered email</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" name="username" class="form-control"
            placeholder="Your username" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Registered Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" name="email" class="form-control"
            placeholder="your@email.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="new_password" id="newPass"
            class="form-control" placeholder="Min 8 characters" required minlength="8">
          <button type="button" class="input-group-text" id="toggleNewPwd">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold">Confirm New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="confirm_password" class="form-control"
            placeholder="Repeat new password" required minlength="8">
        </div>
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-scan">
          <i class="fas fa-save me-2"></i>Reset Password
        </button>
        <p class="auth-switch-text mb-0">Remember your password?</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-auth-outline">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('toggleNewPwd').addEventListener('click', function() {
  const inp = document.getElementById('newPass');
  const icon = this.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
});
</script>
{% endblock %}
