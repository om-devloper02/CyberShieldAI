{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card animate__animated animate__fadeInUp">
    <div class="auth-logo">
      <i class="fas fa-shield-check" style="color:var(--accent-success)"></i>
      <h1>Verify Email</h1>
      <p>Enter the OTP sent to your email</p>
    </div>
    <form method="POST" action="{{ url_for('auth.verify_otp', user_id=user_id) }}">
      <div class="mb-4">
        <label class="form-label small fw-semibold">OTP Code</label>
        <input type="text" name="otp" class="form-control text-center fw-bold fs-4 letter-spacing-3"
          placeholder="- - - - - -" maxlength="6" required autofocus
          style="letter-spacing:0.5rem;">
        <div class="form-text text-center">OTP expires in 10 minutes</div>
      </div>
      <button type="submit" class="btn btn-scan w-100">
        <i class="fas fa-check me-2"></i>Verify
      </button>
    </form>
  </div>
</div>
{% endblock %}
