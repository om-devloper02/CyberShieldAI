{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card animate__animated animate__fadeInUp">
    <div class="auth-logo">
      <i class="fas fa-lock-open" style="color:var(--accent-primary)"></i>
      <h1>Reset Password</h1>
      <p>Enter OTP and your new password</p>
    </div>
    <form method="POST" action="{{ url_for('auth.reset_password') }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">OTP Code</label>
        <input type="text" name="otp" class="form-control" placeholder="Enter OTP" required maxlength="6">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">New Password</label>
        <input type="password" name="new_password" class="form-control" placeholder="Min 8 characters" required minlength="8">
      </div>
      <button type="submit" class="btn btn-scan w-100">
        <i class="fas fa-save me-2"></i>Reset Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
