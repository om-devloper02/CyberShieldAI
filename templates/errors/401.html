{% extends 'base.html' %}
{% block title %}401 Unauthorized{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-icon" style="background:rgba(255,165,2,0.1);color:var(--accent-warning)">
      <i class="fas fa-lock"></i>
    </div>
    <div class="error-code" style="color:var(--accent-warning)">401</div>
    <h3 class="mb-3">Unauthorized</h3>
    <p class="text-muted mb-4">You need to be logged in to access this page.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary"><i class="fas fa-sign-in-alt me-2"></i>Login</a>
  </div>
</div>
{% endblock %}
