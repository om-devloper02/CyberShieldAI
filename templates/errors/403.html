{% extends 'base.html' %}
{% block title %}403 Forbidden{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-icon" style="background:rgba(255,71,87,0.1);color:var(--accent-danger)">
      <i class="fas fa-ban"></i>
    </div>
    <div class="error-code" style="color:var(--accent-danger)">403</div>
    <h3 class="mb-3">Access Forbidden</h3>
    <p class="text-muted mb-4">You don't have permission to access this page. Contact an administrator if you believe this is an error.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary">
      <i class="fas fa-home me-2"></i>Go Home
    </a>
  </div>
</div>
{% endblock %}
