{% extends 'base.html' %}
{% block title %}500 Server Error{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-icon" style="background:rgba(255,71,87,0.1);color:var(--accent-danger)">
      <i class="fas fa-server"></i>
    </div>
    <div class="error-code" style="color:var(--accent-danger)">500</div>
    <h3 class="mb-3">Internal Server Error</h3>
    <p class="text-muted mb-4 mx-auto" style="max-width:400px">Something went wrong on our end. Our team has been notified. Please try again in a few moments.</p>
    <div class="d-flex gap-2 justify-content-center">
      <button class="btn btn-primary" onclick="location.reload()"><i class="fas fa-redo me-2"></i>Try Again</button>
      <a href="/" class="btn btn-outline-secondary"><i class="fas fa-home me-2"></i>Go Home</a>
    </div>
  </div>
</div>
{% endblock %}
